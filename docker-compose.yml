version: "3.9"

services:
  # PostgreSQL database for gateway persistence
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agent — data pollers, risk engine, LLM briefs
  agent:
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AGENT_PORT: "3002"
      GATEWAY_URL: http://gateway:3001
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-orbit-sentinel-internal-key}
    ports:
      - "3002:3002"

  # Gateway — REST API, Socket.io, satellite propagation, persistence
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GATEWAY_PORT: "3001"
      AGENT_URL: http://agent:3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sentinel
      API_KEY: ${API_KEY:-sentinel-api-key}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-orbit-sentinel-internal-key}
    ports:
      - "3001:3001"

  # Frontend — React SPA served via nginx
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_GATEWAY_URL: http://localhost:3001
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  pgdata:
