name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared
        run: npm run build -w packages/shared

      - name: Build agent
        run: npm run build -w packages/agent

      - name: Build gateway
        run: npm run build -w packages/gateway

      - name: Build frontend
        run: npm run build -w packages/frontend

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test, build]

    steps:
      - uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -f packages/agent/Dockerfile -t sentinel-agent:ci .

      - name: Build gateway image
        run: docker build -f packages/gateway/Dockerfile -t sentinel-gateway:ci .

      - name: Build frontend image
        run: docker build -f packages/frontend/Dockerfile -t sentinel-frontend:ci .
